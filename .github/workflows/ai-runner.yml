name: AI runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-runner
  cancel-in-progress: false

jobs:
  dequeue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check runner token on SITester
        id: preflight
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $AI_RUNNER_TOKEN" \
            "$SITESTER_URL/api/v1/ai-runs/ping")
          if [ "$code" != "204" ]; then
            echo "::warning::AI_RUNNER_TOKEN di Vercel belum diset/tidak cocok (HTTP $code). Runner dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SITESTER_URL: ${{ vars.SITESTER_URL }}
          AI_RUNNER_TOKEN: ${{ secrets.AI_RUNNER_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.preflight.outputs.skip != 'true'
      - name: Install e2e web browser
        if: steps.preflight.outputs.skip != 'true'
        run: npx e2e-web install chromium --with-deps
      - name: Run queued AI tests
        if: steps.preflight.outputs.skip != 'true'
        run: npm run ai-runner:once
        env:
          E2E_TELEMETRY_DISABLED: "1"
          SITESTER_URL: ${{ vars.SITESTER_URL }}
          AI_RUNNER_TOKEN: ${{ secrets.AI_RUNNER_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          E2E_MODEL: ${{ vars.E2E_MODEL }}
          AI_TARGET_EMAIL: ${{ secrets.AI_TARGET_EMAIL }}
          AI_TARGET_PASSWORD: ${{ secrets.AI_TARGET_PASSWORD }}
